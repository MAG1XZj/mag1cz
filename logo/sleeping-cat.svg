<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Sleeping cat</title>
  <defs>
    <mask id="cut">
      <rect width="512" height="512" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-linecap="round">
        <!-- tail gap -->
        <path d="M416 336c0 40-26 56-80 56H176" stroke-width="44"/>
        <!-- closed eyes -->
        <path d="M134 300q14 12 28 0M190 300q14 12 28 0" stroke-width="10"/>
      </g>
    </mask>
  </defs>
  <g fill="#1E2340">
    <!-- body + head + ears, cut by mask -->
    <path mask="url(#cut)" d="M96 380c-14-40-10-90 14-122l-6-74 54 42c18-6 38-8 58-6l42-50 10 70c80 6 148 70 148 140H96z"/>
    <!-- tail -->
    <path d="M416 336c0 40-26 56-80 56H176" fill="none" stroke="#1E2340" stroke-width="22" stroke-linecap="round"/>
    <!-- zz -->
    <g fill="none" stroke="#1E2340" stroke-linecap="round" stroke-linejoin="round">
      <path d="M318 140h44l-44 46h44" stroke-width="14"/>
      <path d="M386 92h28l-28 30h28" stroke-width="10"/>
    </g>
  </g>
</svg>
